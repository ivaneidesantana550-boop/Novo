name: Gerar APK Android

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.9"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  APK_RELATIVE_PATH: "app/build/outputs/apk/debug/app-debug.apk"

jobs:
  build-apk:
    name: Compilar APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Localizar e configurar Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "Erro: Android SDK não encontrado em:"
            echo "$SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null \
            | sort -V \
            | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Erro: sdkmanager não encontrado."
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER_ARGS="--sdk_root=$SDK_ROOT"

          yes | "$SDKMANAGER" $SDKMANAGER_ARGS --licenses || true

          "$SDKMANAGER" $SDKMANAGER_ARGS \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Verificar Android SDK instalado
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

          test -d "$SDK_ROOT/platform-tools"
          test -d "$SDK_ROOT/platforms/android-${ANDROID_API_LEVEL}"
          test -d "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"

          echo "Android SDK configurado com sucesso."
          echo "Platform: android-${ANDROID_API_LEVEL}"
          echo "Build Tools: ${ANDROID_BUILD_TOOLS}"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Localizar diretório do projeto Android
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(
            find . \
              -type f \
              -name "settings.gradle.kts" \
              -not -path "*/build/*" \
              -print \
              -quit \
            | xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Erro: settings.gradle.kts não foi encontrado."
            echo
            echo "Arquivos encontrados no repositório:"
            find . -maxdepth 4 -type f | sort | head -200
            echo
            echo "Envie os arquivos extraídos do projeto."
            echo "Não envie somente o arquivo ZIP."
            exit 1
          fi

          echo "Projeto Android encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          set -e

          java -version
          gradle --version

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/rhzin/otimizador/MainActivity.kt

          echo "Estrutura do projeto validada."

      - name: Executar lint do Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:lintDebug

      - name: Gerar APK debug
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Validar APK gerado
        shell: bash
        run: |
          set -e

          APK_FILE="$PROJECT_DIR/$APK_RELATIVE_PATH"

          if [ ! -f "$APK_FILE" ]; then
            echo "Erro: o APK não foi encontrado em:"
            echo "$APK_FILE"
            exit 1
          fi

          if [ ! -s "$APK_FILE" ]; then
            echo "Erro: o APK foi gerado vazio."
            exit 1
          fi

          mkdir -p output

          cp "$APK_FILE" \
            output/RHZIN-Otimizador-debug.apk

          sha256sum \
            output/RHZIN-Otimizador-debug.apk \
            | tee output/RHZIN-Otimizador-debug.apk.sha256

          echo
          echo "APK gerado com sucesso:"
          ls -lh output/RHZIN-Otimizador-debug.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: RHZIN-Otimizador-apk
          path: |
            output/RHZIN-Otimizador-debug.apk
            output/RHZIN-Otimizador-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
