name: Gerar APK Android

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.9"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  build-apk:
    name: Compilar APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "Erro: Android SDK não encontrado."
            echo "Caminho verificado: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(
            find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$SDKMANAGER" ]; then
            echo "Erro: sdkmanager não encontrado."
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

          test -d "$SDK_ROOT/platform-tools"
          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"

          echo "Android SDK configurado com sucesso."

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extrair ZIP e localizar projeto Android
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(
            find . \
              -maxdepth 1 \
              -type f \
              -iname "*.zip" \
              -print \
              -quit
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "Erro: nenhum arquivo ZIP foi encontrado na raiz do repositório."
            echo
            echo "Arquivos encontrados:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Arquivo ZIP encontrado: $ZIP_FILE"

          rm -rf extracted-project
          mkdir -p extracted-project

          unzip -o "$ZIP_FILE" -d extracted-project

          PROJECT_DIR="$(
            find extracted-project \
              -type f \
              -name "settings.gradle.kts" \
              -not -path "*/build/*" \
              -print \
              -quit \
            | xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Erro: settings.gradle.kts não foi encontrado depois da extração."
            echo
            echo "Arquivos extraídos:"
            find extracted-project -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Projeto Android encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          set -e

          java -version
          gradle --version

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/rhzin/otimizador/MainActivity.kt

          echo "Estrutura do projeto validada."

      - name: Executar lint do Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:lintDebug

      - name: Gerar APK debug
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Validar e preparar APK
        shell: bash
        run: |
          set -e

          APK_FILE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "Erro: APK não foi encontrado em:"
            echo "$APK_FILE"
            exit 1
          fi

          if [ ! -s "$APK_FILE" ]; then
            echo "Erro: o APK foi gerado vazio."
            exit 1
          fi

          mkdir -p output

          cp "$APK_FILE" \
            output/RHZIN-Otimizador-debug.apk

          sha256sum \
            output/RHZIN-Otimizador-debug.apk \
            | tee output/RHZIN-Otimizador-debug.apk.sha256

          echo
          echo "APK gerado com sucesso:"
          ls -lh output/RHZIN-Otimizador-debug.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: RHZIN-Otimizador-apk
          path: |
            output/RHZIN-Otimizador-debug.apk
            output/RHZIN-Otimizador-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
